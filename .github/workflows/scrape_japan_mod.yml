name: 爬取日本防衛省中國海軍艦艇動向

on:
  schedule:
    # 每天台北時間 14:00 執行 (UTC 06:00)
    - cron: '0 6 * * *'
  workflow_dispatch:  # 允許手動觸發
    inputs:
      rebuild_straits:
        description: '海峽欄位回填模式：重抓歷史 PDF，只更新四個海峽欄位與國家欄位，不動艦型/備考等人工修正'
        type: boolean
        default: false
      rebuild_reports:
        description: '通報重算模式：依現行判讀規則重跑 data/pdf_texts 快取，回填艦型/備考/國家/0-1 欄位（不動四個海峽欄位，那個請用 rebuild_straits）'
        type: boolean
        default: false
      rebuild_dates:
        description: '指定要回填的日期（逗號分隔，如 2025-07-24,2026-01-15）。留空則沿用 history 裡的全部 PDF。history 只回溯到 2026-02-18，更早的日期一定要用這個。'
        type: string
        default: ''

concurrency:
  group: csv-battleship-writers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      run: |
        pip install pandas PyPDF2 httpx requests python-dateutil

    - name: Run Japan MOD scraper
      env:
        # 指定了日期就一定是回填模式，不必兩個選項都勾。
        # rebuild_reports 會被優先處理（見 scraper_japan_mod.main）。
        REBUILD_REPORTS: ${{ inputs.rebuild_reports && '1' || '0' }}
        REBUILD_STRAITS: ${{ (inputs.rebuild_straits || (inputs.rebuild_dates != '' && !inputs.rebuild_reports)) && '1' || '0' }}
        REBUILD_DATES: ${{ inputs.rebuild_dates }}
      run: python scraper_japan_mod.py
      
    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/JapanandBattleship.csv data/japan_scrape_history.json
        # 回填模式的海峽衝突診斷。runner 是 ephemeral，沒 add 就跟著消失。
        git add -f data/logs/strait_conflicts.json 2>/dev/null || true
        # PDF 原文快取，讓判讀邏輯能離線反覆驗證，不必每次重抓
        git add -f data/pdf_texts/japan_mod_texts.json 2>/dev/null || true
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "🇯🇵 更新日本防衛省資料 $(date +'%Y-%m-%d %H:%M')"
          # Retry push with pull --rebase to handle concurrent updates
          for i in 1 2 3 4; do
            git push && break
            echo "Push failed (attempt $i/4), pulling latest changes..."
            git pull --rebase --autostash -X theirs origin main
            sleep $((2 ** i))
          done
        fi
