name: 每日更新國防部資料

on:
  schedule:
    # 每天 UTC 時間 00:00 執行 (台北時間 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允許手動觸發

concurrency:
  group: csv-battleship-writers
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        sudo install -m 0755 -d /etc/apt/keyrings
        wget -qO- https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /etc/apt/keyrings/google-chrome.gpg > /dev/null
        sudo chmod a+r /etc/apt/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    - name: Install Python dependencies
      run: |
        pip install selenium webdriver-manager beautifulsoup4 pandas
        
    - name: Run scraper
      run: python scraper.py
      
    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/JapanandBattleship.csv
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "🤖 自動更新國防部資料 $(date +'%Y-%m-%d %H:%M:%S')"
          # Retry push with pull --rebase to handle concurrent updates
          for i in 1 2 3 4; do
            git push && break
            echo "Push failed (attempt $i/4), pulling latest changes..."
            git pull --rebase --autostash -X theirs origin main
            sleep $((2 ** i))
          done
        fi
